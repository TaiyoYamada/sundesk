[project]
name = "sundesk-engine"
version = "0.1.0"
description = "sundesk の AI エンジン（LLM、画像生成、埋め込み、自然言語処理、グラフ計算）"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-AllRightsReserved"
authors = [{ name = "山田大陽" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.33.0",
    "mflux>=0.20.0",
    "mlx>=0.32.2",
    "mlx-lm>=0.31.3",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "sentence-transformers>=6.1.0",
    "sudachidict-core>=20260723.1",
    "sudachipy>=0.7.0",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sundesk-engine = "sundesk_engine.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "S"]
# 日本語の文章では全角の括弧や句読点を意図して使う
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert を使う
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["sundesk_engine"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
