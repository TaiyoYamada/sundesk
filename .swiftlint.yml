# SwiftLint の設定。整形（インデントや改行）は swift-format に任せ、
# ここでは書き方の決まりと、ファイルのヘッダーを検査する。

included:
  - sundesk
  - sundeskTests
  - sundeskUITests
  - Packages/SundeskKit/Sources
  - Packages/SundeskKit/Tests

excluded:
  - Packages/SundeskKit/.build

disabled_rules:
  # 以下は swift-format と重なる、または食い違うので無効にする
  - trailing_comma
  - opening_brace
  - vertical_parameter_alignment

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - file_header
  - first_where
  - last_where
  - modifier_order
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - vertical_whitespace_closing_braces

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
    - fd
    - x
    - y
    - ai
    - uv

# すべての Swift ファイルに Xcode 形式のヘッダーを求める（CONTRIBUTING.md を参照）
file_header:
  required_pattern: |
    \/\/
    \/\/  SWIFTLINT_CURRENT_FILENAME
    \/\/  [A-Za-z]+
    \/\/
    \/\/  Created by 山田大陽 on \d{4}\/\d{2}\/\d{2}\.
    \/\/
