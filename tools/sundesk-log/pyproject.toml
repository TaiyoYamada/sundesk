[project]
name = "sundesk-log"
version = "0.1.0"
description = "実験の結果を sundesk の取り込み箱へ書く記録用ライブラリ"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-AllRightsReserved"
authors = [{ name = "山田大陽" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "S"]
# 日本語の文章では全角の括弧や句読点を意図して使う
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# テストでは assert を使う
"tests/**" = ["S101"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["sundesk_log"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
