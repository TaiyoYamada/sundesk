name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 0 * * 1"  # 毎週月曜 9:00（日本時間）

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: 解析（${{ matrix.language }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Swift は、CodeQL が Swift 6.4 に対応したら加える（2026-09 時点の対応は 6.3.3 まで）
        language: [python, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
