name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # 結合テストで本物の Python エンジンを起動するので、uv も入れる
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: ツールのバージョン
        run: |
          xcodebuild -version
          swift --version
          uv --version

      - name: SwiftLint を用意する
        run: command -v swiftlint || brew install swiftlint

      - name: 静的チェック
        run: make lint-swift

      # 結合テストがエンジンを起動する前に、依存関係（mlx など）をそろえておく。
      # テストの中で `uv run` に任せると、最初の起動が待ち時間の上限を超える
      - name: エンジンの環境を用意する
        working-directory: engine
        run: uv sync --locked

      # GPU（Metal）を使うテストと、エンジンを起動するテストは、仮想マシンで止まることがあるので手順を分ける
      - name: パッケージのテスト
        timeout-minutes: 20
        run: swift test --package-path Packages/SundeskKit --enable-code-coverage --skip "GraphLayoutTests|EngineProcessTests"

      - name: カバレッジ
        run: |
          {
            echo "## Swift パッケージのカバレッジ"
            echo
            scripts/swift-coverage.sh
          } >> "$GITHUB_STEP_SUMMARY"

      - name: エンジンを起動する結合テスト
        timeout-minutes: 10
        env:
          SUNDESK_INTEGRATION: "1"
        run: swift test --package-path Packages/SundeskKit --filter EngineProcessTests

      - name: 知識グラフの配置（GPU）のテスト
        timeout-minutes: 10
        run: swift test --package-path Packages/SundeskKit --filter GraphLayoutTests

      - name: アプリのユニットテスト
        run: make test-app XCODEBUILD_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="

  python:
    name: Python
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: 依存関係をそろえる
        run: uv sync --locked

      - name: 静的チェック
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: テスト
        run: uv run pytest --cov

      - name: カバレッジ
        run: |
          {
            echo "## Python エンジンのカバレッジ"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

  log:
    name: 記録用ライブラリ（Python ${{ matrix.python }}）
    runs-on: macos-26
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 対応する最も古い版と、手元で使っている版
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: tools/sundesk-log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/sundesk-log/uv.lock
          python-version: ${{ matrix.python }}

      - name: 依存関係をそろえる
        run: uv sync --locked

      - name: 静的チェック
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pyright

      - name: テスト
        run: uv run pytest --cov
