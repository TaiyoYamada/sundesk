name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift:
    name: Swift
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: ツールのバージョン
        run: |
          xcodebuild -version
          swift --version

      - name: SwiftLint を用意する
        run: command -v swiftlint || brew install swiftlint

      - name: 静的チェック
        run: make lint-swift

      # カバレッジは取らない（tree-sitter の文法の巨大な C ファイルまで集計するので、仮想マシンでは時間切れになる）。
      # 手元では `make coverage` で見る
      - name: パッケージのテスト
        timeout-minutes: 20
        run: swift test --package-path Packages/SundeskKit

      - name: アプリのユニットテスト
        run: make test-app XCODEBUILD_FLAGS="CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="
